{% extends "base.html" %}
{% block title %}400 - Bad Request | StitchSense{% endblock %}
{% block content %}
<div class="error-page">
    <div class="error-code">400</div>
    <h2>Invalid Request</h2>
    <p>{{ error_message or "The server could not understand your request. Please ensure you uploaded a valid image." }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
