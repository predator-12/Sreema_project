# StitchSense Configuration File
# Optimized for Windows 11 / Intel Iris Xe CPU execution

project:
  name: "StitchSense"
  version: "1.0.0"
  description: "AI-Powered Sewing Defect Detection and Repair Assistant"

device:
  use_cuda: false
  num_threads: 4 # Optimized for Intel Iris Xe CPU multi-threading

model:
  architecture: "Unet"          # Options: Unet, DeepLabV3Plus, FPN
  encoder_name: "mobilenet_v2"  # Lightweight for fast CPU inference (~45-80ms)
  encoder_weights: "imagenet"   # Transfer learning pretraining
  in_channels: 3
  classes: 6                    # Background + 5 Defect Categories

classes:
  0: "Normal / Background"
  1: "Broken / Skipped Stitch"
  2: "Seam Puckering"
  3: "Open Seam"
  4: "Misaligned Seam"
  5: "Needle Cut / Fabric Hole"

class_colors: # RGB colors for visualization overlay
  0: [0, 0, 0]         # Background (Transparent)
  1: [255, 59, 48]     # Bright Red (Skipped Stitch)
  2: [255, 149, 0]     # Orange (Puckering)
  3: [175, 82, 222]    # Purple (Open Seam)
  4: [255, 204, 0]     # Yellow (Misaligned Seam)
  5: [0, 122, 255]     # Blue (Needle Cut)

dataset:
  raw_dir: "data/raw"
  images_dir: "data/processed/images"
  masks_dir: "data/processed/masks"
  splits_dir: "data/splits"
  image_size: [512, 512]       # [Height, Width] optimal for CPU memory and seam resolution
  batch_size: 4                # CPU-friendly batch size
  num_workers: 0               # Recommended 0 for Windows multiprocessing stability

training:
  epochs: 25
  learning_rate: 0.0003
  weight_decay: 0.0001
  focal_loss_weight: 0.6
  dice_loss_weight: 0.4
  early_stopping_patience: 6
  save_dir: "weights"
  checkpoint_name: "stitchsense_best.pth"

inference:
  confidence_threshold: 0.45   # Minimum probability threshold for defect pixel
  min_defect_area_px: 25       # Minimum contour area to reject single-pixel noise

